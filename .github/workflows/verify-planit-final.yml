name: Verify PlanIt main frontend
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/verify-planit-final.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve dependencies
        working-directory: frontend
        run: flutter pub get
      - name: Generate localization
        working-directory: frontend
        run: flutter gen-l10n
      - name: Static analysis
        working-directory: frontend
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Plan Preferences screen regression
        working-directory: frontend
        run: flutter test test/room_conditions_screen_test.dart
      - name: Build Android debug APK
        working-directory: frontend
        run: flutter build apk --debug --dart-define=PLANIT_API_BASE_URL=https://planit-team-backend.vercel.app
