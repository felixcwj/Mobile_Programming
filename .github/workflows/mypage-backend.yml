name: MyPage backend checks

on:
  push:
    branches:
      - feature/mypage-backend
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/mypage-backend.yml"

jobs:
  mypage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt pytest
      - name: Verify Python syntax
        run: python -m compileall -q backend
      - name: Run MyPage API tests
        run: |
          cd backend
          python -m pytest -q tests/test_mypage.py tests/test_mypage_login_compat.py tests/test_account_cleanup.py
