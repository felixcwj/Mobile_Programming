name: Materialize integrated Flutter source in main
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-final-main.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'felixcwj/Mobile_Programming'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: true
      - name: Materialize final Flutter frontend
        shell: bash
        run: |
          set -euo pipefail
          python3 integration/apply_frontend.py
          test -f frontend/lib/services/planit_api.dart
          test -f frontend/lib/screens/rooms/room_conditions_screen.dart
          test -f frontend/lib/widgets/numeric_date_time_formatter.dart
          test -f frontend/pubspec.yaml
          git rm --cached frontend
          rm -f frontend/.git
          git rm .gitmodules
          git add -A frontend
          git status --short
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check integrated Flutter application
        working-directory: frontend
        run: |
          flutter pub get
          flutter gen-l10n
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Commit fully integrated frontend to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/pubspec.lock
          git rm .github/workflows/materialize-final-main.yml
          git commit -m 'Materialize complete Flutter frontend in main; remove submodule'
          git push origin HEAD:main
