name: PlanIt isolated integration checks
on:
  push:
    branches:
      - experiment/wonjoon-planit-integration
  workflow_dispatch:

jobs:
  flutter-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original frontend binary assets
        run: bash frontend/tools/restore_upstream_assets.sh
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - name: Install Flutter dependencies
        working-directory: frontend
        run: flutter pub get
      - name: Analyze Flutter source
        working-directory: frontend
        run: flutter analyze --no-fatal-infos
      - name: Build Flutter web
        working-directory: frontend
        run: flutter build web --dart-define=PLANIT_API_BASE_URL=http://localhost:8000
      - name: Test connected API and standalone profile UI
        working-directory: frontend
        run: flutter test test/api_integration_test.dart test/profile_test.dart test/profile_support_test.dart test/token_refresh_test.dart
      - name: Test authenticated app, calendar and room UI (required)
        working-directory: frontend
        run: flutter test test/widget_test.dart test/calendar_test.dart test/rooms_test.dart test/room_preferences_persistence_test.dart test/rapid_interaction_stress_test.dart

  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt pytest
      - run: python -m compileall -q backend
      - name: Run all backend tests
        working-directory: backend
        run: python -m pytest -q tests
