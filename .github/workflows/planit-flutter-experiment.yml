name: PlanIt Flutter experimental integration
on:
  push:
    branches:
      - experiment/wonjoon-planit-integration
  workflow_dispatch:

jobs:
  flutter-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original frontend binary assets
        run: bash frontend/tools/restore_upstream_assets.sh
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - name: Install Flutter dependencies
        working-directory: frontend
        run: flutter pub get
      - name: Analyze Flutter source
        working-directory: frontend
        run: flutter analyze --no-fatal-infos
      - name: Run Flutter unit/widget tests
        working-directory: frontend
        run: flutter test
      - name: Build Flutter web
        working-directory: frontend
        run: flutter build web --dart-define=PLANIT_API_BASE_URL=http://localhost:8000
