name: PlanIt team integration (Flutter)
on:
  push:
    branches:
      - experiment/planit-team-integration-20261122
  workflow_dispatch:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply integration implementation
        run: python3 integration/apply_frontend.py
      - name: Resolve Flutter dependencies
        working-directory: frontend
        run: flutter pub get
      - name: Static analysis
        working-directory: frontend
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Widget tests
        working-directory: frontend
        run: flutter test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend test dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt pytest
      - name: Run backend tests with fake Firebase
        working-directory: backend
        run: python -m pytest -q
