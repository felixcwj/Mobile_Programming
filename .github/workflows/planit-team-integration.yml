name: PlanIt team integration (Flutter)
on:
  push:
    branches:
      - experiment/planit-team-integration-20261122
  workflow_dispatch:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true
      - name: Apply integration implementation
        run: python3 integration/apply_frontend.py
      - name: Resolve Flutter dependencies
        working-directory: frontend
        run: flutter pub get
      - name: Static analysis
        working-directory: frontend
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Widget tests
        working-directory: frontend
        run: flutter test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Android debug APK (Android emulator backend)
        working-directory: frontend
        run: flutter build apk --debug --dart-define=PLANIT_API_BASE_URL=http://10.0.2.2:8000
      - name: Upload Android emulator APK
        uses: actions/upload-artifact@v4
        with:
          name: planit-integrated-android-emulator
          path: frontend/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend test dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt pytest
      - name: Run backend tests with fake Firebase
        working-directory: backend
        run: python -m pytest -q
