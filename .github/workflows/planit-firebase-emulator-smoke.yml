name: PlanIt live Firebase emulator API smoke

on:
  push:
    branches:
      - experiment/planit-team-integration-20261122
  workflow_dispatch:

concurrency:
  group: ${'${{ github.workflow }}'}-${'${{ github.ref }}'}
  cancel-in-progress: true

permissions:
  contents: read

concurrency:
  group: ${'${{ github.workflow }}'}-${'${{ github.ref }}'}
  cancel-in-progress: true

jobs:
  firebase-emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run FastAPI against isolated Firebase Auth and Firestore emulators
        run: >
          npx --yes firebase-tools@14.12.0 emulators:exec
          --project demo-planit --only auth,firestore
          --config backend/firebase-emulator.json
          "python backend/ci_emulator_smoke.py"
